<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目卡片</title>
  <script type="module" crossorigin src="./assets/index.d7b316a8.js"></script>
  <link rel="stylesheet" href="./assets/index.27fc5a99.css">
</head>

<body>
  <main id="app">
    <section id="config_block" hidden>
      <h2>项目卡片 · 配置</h2>
      <p class="hint">读取本多维表格里的「项目库」，按状态显示项目卡片。只需确认数据表后点保存。</p>
      <label for="tableSelect">数据表</label>
      <select id="tableSelect"></select>
      <button type="button" id="save_btn">保存</button>
    </section>

    <section id="view_block" hidden>
      <header class="bar">
        <div class="tabs" role="tablist">
          <button type="button" class="tab" data-tab="act" aria-selected="true">可操作 <b data-count="act"></b></button>
          <button type="button" class="tab" data-tab="pending" aria-selected="false" title="收益过线，但准入未核实、超额太小或公司不能参加">待核实·观察 <b data-count="pending"></b></button>
          <button type="button" class="tab" data-tab="soon" aria-selected="false">近期截止 <b data-count="soon"></b></button>
          <button type="button" class="tab" data-tab="research" aria-selected="false">研究中 <b data-count="research"></b></button>
        </div>
        <span class="updated" id="updated"></span>
      </header>
      <div class="grid" id="cards"></div>
      <p class="empty" id="empty" hidden>这一栏暂时没有项目</p>
      <p class="foot">资金、行情与抵押品各有独立取证时间。操作前刷新核对，研究结论不代表资金批准。</p>
    </section>
  </main>
  
</body>

</html>
